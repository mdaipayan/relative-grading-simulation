[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relative_grading_simulation"
version = "1.0.0"
description = "Reproducible simulation framework for robust relative grading in engineering education"
authors = [
    { name = "Research Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
